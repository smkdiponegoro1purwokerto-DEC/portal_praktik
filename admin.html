<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Portal Pengawasan & Cetak Laporan CVT — Guru</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h2 {
      margin-top: 0;
      color: #0f172a;
      border-bottom: 2px solid #2563eb;
      padding-bottom: 10px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #f8fafc;
      padding: 12px 15px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      margin-bottom: 15px;
    }
    .filter-bar label {
      font-size: 13px;
      font-weight: bold;
      color: #334155;
    }
    .filter-bar input[type="date"] {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }
    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      font-size: 13px;
    }
    .btn:hover { background-color: #1d4ed8; }
    .btn-secondary { background-color: #64748b; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-danger { background-color: #dc2626; }
    .btn-danger:hover { background-color: #b91c1c; }
    .btn-print { background-color: #059669; }
    .btn-print:hover { background-color: #047857; }

    /* BOX LOGIN GURU */
    .login-box {
      max-width: 380px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border: 1px solid #e2e8f0;
    }
    .login-box h3 { margin-top: 0; color: #1e293b; text-align: center; }
    .login-box label { font-size: 13px; font-weight: bold; display: block; margin-top: 12px; }
    .login-box input[type="text"], 
    .login-box input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 14px;
    }

    .show-password-opt {
      display: flex;
      align-items: center;
      margin-top: 8px;
      font-size: 12px;
      color: #475569;
      cursor: pointer;
      user-select: none;
    }
    .show-password-opt input[type="checkbox"] {
      margin-right: 6px;
      cursor: pointer;
    }

    .hidden { display: none !important; }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    table.data-table th, table.data-table td {
      border: 1px solid #cbd5e1;
      padding: 10px;
      font-size: 13px;
      text-align: left;
    }
    table.data-table th { background-color: #f8fafc; font-weight: bold; }
    table.data-table tr:hover { background-color: #f1f5f9; }

    /* MODAL CETAK */
    .print-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      overflow-y: auto;
    }
    .print-paper {
      max-width: 800px;
      margin: 30px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    
    @media print {
      @page { size: A4 portrait; margin: 12mm 15mm 12mm 15mm; }
      body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
      body * { visibility: hidden; }
      .print-modal, .print-modal * { visibility: visible; }
      .print-modal {
        position: absolute !important; left: 0 !important; top: 0 !important;
        width: 100% !important; height: auto !important; overflow: visible !important;
        background: none !important; display: block !important;
      }
      .print-paper { box-shadow: none !important; padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
      .no-print { display: none !important; }
      .page-break { page-break-before: always !important; break-before: page !important; }
      .avoid-break { page-break-inside: avoid !important; break-inside: avoid !important; }
    }

    .header-title { text-align: center; font-weight: bold; margin-bottom: 12px; }
    .header-title h3 { margin: 2px 0; font-size: 15px; }
    .header-title h4 { margin: 2px 0; font-size: 13px; text-transform: uppercase; }
    .header-title p { margin: 2px 0; font-size: 10px; font-style: italic; }

    table.table-doc { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    table.table-doc th, table.table-doc td { border: 1px solid #000; padding: 4px 6px; font-size: 10.5px; vertical-align: middle; }
    table.table-doc th { background-color: #f1f5f9; text-align: center; }
    .text-center { text-align: center; }
    .section-title { font-weight: bold; font-size: 11.5px; margin-top: 12px; margin-bottom: 4px; }
    .question-block { margin-bottom: 8px; font-size: 10.5px; page-break-inside: avoid; }
    .ans-box { border: 1px solid #000; padding: 5px; font-size: 10.5px; background: #fafafa; min-height: 28px; margin-top: 2px; }
    .ttd-container { margin-top: 15px; float: right; width: 220px; text-align: center; font-size: 10.5px; page-break-inside: avoid; }
    .clear-fix { clear: both; }
  </style>
</head>
<body>

  <!-- 1. HALAMAN LOGIN GURU -->
  <div id="loginGuruBox" class="login-box">
    <h3>LOGIN PENGAWAS / GURU</h3>
    <p style="text-align: center; font-size:12px; color:#64748b; margin-top:-5px;">SMK Diponegoro 1 Purwokerto</p>
    <form onsubmit="handleGuruLogin(event)">
      <label>Username:</label>
      <input type="text" id="guruUser" required placeholder="Masukkan username admin">
      
      <label>Password:</label>
      <input type="password" id="guruPass" required placeholder="Masukkan password">
      
      <div class="show-password-opt">
        <input type="checkbox" id="togglePassword" onclick="togglePassView()">
        <label for="togglePassword" style="margin-top:0; font-weight:normal; cursor:pointer;">Lihat Password</label>
      </div>
      
      <button type="submit" id="btnLoginGuru" class="btn" style="width: 100%; margin-top: 20px; padding: 12px;">Masuk Portal Pengawasan</button>
    </form>
  </div>

  <!-- 2. HALAMAN UTAMA ADMIN PENGAWASAN -->
  <div id="adminPanel" class="container hidden">
    <div class="top-bar">
      <div>
        <h2 style="border:none; margin:0; padding:0;">PORTAL PENGAWASAN & CETAK LAPORAN CVT</h2>
        <span style="font-size:13px; color:#2563eb;" id="greetingGuru">Selamat Datang, Admin</span>
      </div>
      <div>
        <button onclick="loadData()" class="btn">🔄 Refresh Data</button>
        <button onclick="handleLogout()" class="btn btn-danger">🚪 Keluar (Logout)</button>
      </div>
    </div>

    <!-- FITUR FILTER TANGGAL -->
    <div class="filter-bar">
      <label for="filterDate">📅 Filter Tanggal Pengiriman:</label>
      <input type="date" id="filterDate" onchange="renderFilteredData()">
      <button onclick="resetDateFilter()" class="btn btn-secondary" style="padding:6px 12px; font-size:12px;">Tampilkan Semua</button>
    </div>

    <p style="font-size:13px; color:#64748b;">Daftar siswa yang menyelesaikan lembar pengamatan Overhaul CVT pada tanggal terpilih:</p>

    <table class="data-table">
      <thead>
        <tr>
          <th width="5%">No</th>
          <th width="15%">Waktu Kirim</th>
          <th width="12%">No. Tes</th>
          <th width="25%">Nama Siswa</th>
          <th width="15%">Kelas</th>
          <th width="18%" style="text-align:center;">Aksi</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="6" style="text-align:center;">Memuat data respon...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- MODAL PRATINJAU DOKUMEN CETAK -->
  <div id="printModal" class="print-modal">
    <div class="no-print" style="max-width: 800px; margin: 15px auto 0 auto; text-align: right;">
      <button onclick="window.print()" class="btn btn-print">🖨️ Cetak Dokumen (PDF / Print)</button>
      <button onclick="closeModal()" class="btn btn-secondary">❌ Tutup</button>
    </div>

    <div id="printArea" class="print-paper">
      <!-- Content Cetak -->
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwMsCqOyez6EaiUT4h2sTmV2PgeClX9KomS9_ufq_Nar_iYARuiefJCdKr9qMZD53vtbA/exec";
    let responDataList = [];
    let currentFilteredList = [];
    const defaultTitle = "Portal Pengawasan & Cetak Laporan CVT — Guru";

    function togglePassView() {
      const passInput = document.getElementById("guruPass");
      passInput.type = passInput.type === "password" ? "text" : "password";
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Set input tanggal otomatis ke hari ini (Format YYYY-MM-DD)
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('filterDate').value = todayStr;

      const activeGuru = sessionStorage.getItem('guru_session');
      if (activeGuru) {
        showAdminPanel(JSON.parse(activeGuru));
      }
    });

    async function handleGuruLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLoginGuru');
      btn.disabled = true;
      btn.innerText = "Memeriksa Akun...";

      const u = document.getElementById('guruUser').value;
      const p = document.getElementById('guruPass').value;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "loginGuru", username: u, password: p })
        }).then(r => r.json());

        if (res.success) {
          sessionStorage.setItem('guru_session', JSON.stringify(res.guru));
          showAdminPanel(res.guru);
        } else {
          alert(res.message);
        }
      } catch (err) {
        alert("Gagal koneksi server: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Masuk Portal Pengawasan";
      }
    }

    function showAdminPanel(guru) {
      document.getElementById('loginGuruBox').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('greetingGuru').innerText = `Pengawas Aktif: ${guru.nama}`;
      loadData();
    }

    function handleLogout() {
      sessionStorage.removeItem('guru_session');
      location.reload();
    }

    async function loadData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Memuat data terbaru...</td></tr>`;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getResponList" })
        }).then(r => r.json());

        if (res.success && res.data.length > 0) {
          responDataList = res.data;
          renderFilteredData();
        } else {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada data pengiriman lembar pengamatan.</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Gagal mengambil data: ${err.message}</td></tr>`;
      }
    }

    // FUNGSI RENDER TABEL SESUAI FILTER TANGGAL
    function renderFilteredData() {
      const tbody = document.getElementById('tableBody');
      const selectedDate = document.getElementById('filterDate').value;

      if (!responDataList || responDataList.length === 0) return;

      if (selectedDate) {
        currentFilteredList = responDataList.filter(item => {
          const itemDate = new Date(item.timestamp);
          // Format YYYY-MM-DD lokal
          const year = itemDate.getFullYear();
          const month = String(itemDate.getMonth() + 1).padStart(2, '0');
          const day = String(itemDate.getDate()).padStart(2, '0');
          const itemDateStr = `${year}-${month}-${day}`;
          
          return itemDateStr === selectedDate;
        });
      } else {
        currentFilteredList = [...responDataList];
      }

      if (currentFilteredList.length > 0) {
        tbody.innerHTML = currentFilteredList.map((item, index) => {
          const tgl = new Date(item.timestamp).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
          return `
            <tr>
              <td style="text-align:center;">${index + 1}</td>
              <td>${tgl}</td>
              <td><b>${item.noTes}</b></td>
              <td>${item.nama}</td>
              <td>${item.kelas}</td>
              <td style="text-align:center;">
                <button onclick="previewCetak(${index})" class="btn btn-print" style="padding: 5px 10px; font-size: 12px;">🖨️ Pratinjau & Cetak</button>
              </td>
            </tr>
          `;
        }).join('');
      } else {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#64748b;">Tidak ada data laporan siswa pada tanggal ${selectedDate ? formatDateIndo(selectedDate) : ''}.</td></tr>`;
      }
    }

    function resetDateFilter() {
      document.getElementById('filterDate').value = "";
      renderFilteredData();
    }

    function formatDateIndo(dateStr) {
      const p = dateStr.split('-');
      return `${p[2]}/${p[1]}/${p[0]}`;
    }

    function previewCetak(filteredIndex) {
      const d = currentFilteredList[filteredIndex];
      document.title = `Lembar Pengamatan CVT — ${d.nama} (${d.noTes})`;

      const tglFormatted = new Date(d.timestamp).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      const kompList = ['V-Belt', 'Roller', 'Drive Pulley', 'Driven Pulley', 'Kampas Ganda', 'Cover CVT'];
      const prosList = [
        "Melepas cover CVT secara berurutan dan aman sesuai posisi baut.",
        "Melepas mur pengikat drive pulley menggunakan SST yang sesuai.",
        "Melepas komponen drive pulley, V-belt, dan driven pulley secara sistematis.",
        "Membersihkan seluruh komponen dari kotoran/debu menggunakan cairan pembersih.",
        "Memeriksa keausan, keretakan V-belt, keausan roller, serta goresan pulley.",
        "Melakukan pengukuran komponen (lebar V-belt, diameter roller/pulley).",
        "Menentukan tindakan perawatan (greasing) atau penggantian komponen aus.",
        "Merakit kembali komponen CVT sesuai urutan yang benar.",
        "Pengencangan mur pulley menggunakan kunci momen (torque wrench) sesuai spesifikasi.",
        "Pemeriksaan akhir (free play, fungsi putaran, test run) dan pelaporan."
      ];

      const html = `
        <div class="header-title">
          <h3>SMK DIPONEGORO 1 PURWOKERTO</h3>
          <h4>LEMBAR PENGAMATAN PRAKTIK TEKNIK SEPEDA MOTOR</h4>
          <p>OVERHAUL CVT (CONTINUOUSLY VARIABLE TRANSMISSION) — VERSI CHECKLIST & JAWABAN SINGKAT</p>
        </div>

        <table class="table-doc">
          <tr>
            <td width="18%"><b>Nama Peserta:</b></td>
            <td width="32%">${d.nama}</td>
            <td width="18%"><b>No. Tes:</b></td>
            <td width="32%">${d.noTes}</td>
          </tr>
          <tr>
            <td><b>Kelas / Sem:</b></td>
            <td>${d.kelas}</td>
            <td><b>Hari / Tanggal:</b></td>
            <td>${tglFormatted}</td>
          </tr>
        </table>

        <div class="section-title">I. CHECKLIST K3, PERSIAPAN & KELENGKAPAN ALAT</div>
        <table class="table-doc">
          <thead>
            <tr><th width="6%">No</th><th>Aspek K3 & APD</th><th width="10%">Ya</th><th width="10%">Tidak</th></tr>
          </thead>
          <tbody>
            ${[
              "Menggunakan pakaian kerja (wearpack), sepatu safety, dan kacamata pelindung.",
              "Memastikan sepeda motor dalam kondisi aman dan mesin mati.",
              "Menyiapkan area kerja yang bersih, terang, serta wadah komponen.",
              "Mempersiapkan kunci sok/ring/pas, ratchet, torque wrench, dan SST.",
              "Memastikan cairan pembersih, kompresor, dan kain lap siap digunakan."
            ].map((k, i) => `
              <tr>
                <td class="text-center">${i+1}</td>
                <td>${k}</td>
                <td class="text-center">${d.k3[i] === 'Ya' ? '✔' : ''}</td>
                <td class="text-center">${d.k3[i] === 'Tidak' ? '✔' : ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="section-title">II. LEMBAR IDENTIFIKASI KOMPONEN CVT</div>
        <table class="table-doc">
          <thead>
            <tr><th width="6%">No</th><th width="25%">Nama Komponen</th><th width="35%">Fungsi Utama</th><th>Prinsip Kerja / Keterangan</th></tr>
          </thead>
          <tbody>
            ${['Drive Pulley', 'Driven Pulley', 'V-Belt', 'Roller', 'Kampas Ganda & Clutch', 'Gigi Reduksi'].map((k, i) => `
              <tr>
                <td class="text-center">${i+1}</td>
                <td><b>${k}</b></td>
                <td>${d.identifikasi[i] ? d.identifikasi[i].fungsi : '-'}</td>
                <td>${d.identifikasi[i] ? d.identifikasi[i].ket : '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="section-title">III. HASIL PEMERIKSAAN & PENGUKURAN</div>
        <table class="table-doc">
          <thead>
            <tr><th width="6%">No</th><th width="20%">Komponen</th><th width="18%">Visual</th><th width="20%">Hasil Ukur</th><th>Tindakan Perbaikan</th></tr>
          </thead>
          <tbody>
            ${kompList.map((k, i) => `
              <tr>
                <td class="text-center">${i+1}</td>
                <td><b>${k}</b></td>
                <td class="text-center">${d.pengukuran[i] ? d.pengukuran[i].visual : '-'}</td>
                <td>${d.pengukuran[i] ? d.pengukuran[i].hasilUkur : '-'}</td>
                <td>${d.pengukuran[i] ? d.pengukuran[i].tindakan : '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="page-break"></div>

        <div class="section-title" style="margin-top:0;">IV. CHECKLIST PROSEDUR KERJA OVERHAUL CVT</div>
        <table class="table-doc">
          <thead>
            <tr><th width="6%">No</th><th>Langkah Prosedur Kerja</th><th width="10%">Ya</th><th width="10%">Tidak</th></tr>
          </thead>
          <tbody>
            ${prosList.map((p, i) => `
              <tr>
                <td class="text-center">${i+1}</td>
                <td>${p}</td>
                <td class="text-center">${d.prosedur[i] === 'Ya' ? '✔' : ''}</td>
                <td class="text-center">${d.prosedur[i] === 'Tidak' ? '✔' : ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="section-title">V. ANALISIS HASIL PRAKTIK (JAWABAN SINGKAT)</div>
        <div class="question-block">1. Komponen aus/tidak sesuai:<div class="ans-box">${d.ans1}</div></div>
        <div class="question-block">2. Tindakan perawatan/penggantian:<div class="ans-box">${d.ans2}</div></div>
        <div class="question-block">3. Penyebab getaran/suara tidak normal:<div class="ans-box">${d.ans3}</div></div>
        <div class="question-block">4. Cara memastikan kesesuaian prosedur:<div class="ans-box">${d.ans4}</div></div>
        <div class="question-block">5. Kesimpulan overhaul CVT:<div class="ans-box">${d.ans5}</div></div>

        <div class="ttd-container avoid-break">
          Purwokerto, ${tglFormatted}<br>
          Peserta Didik,<br>
          <img src="${d.ttdBase64}" style="width:120px; height:60px; margin:4px 0;"><br>
          <b>(${d.nama})</b>
        </div>
        <div class="clear-fix"></div>
      `;

      document.getElementById('printArea').innerHTML = html;
      document.getElementById('printModal').style.display = 'block';
    }

    function closeModal() {
      document.title = defaultTitle;
      document.getElementById('printModal').style.display = 'none';
    }
  </script>
</body>
</html>
