<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pengawasan & Cetak Laporan CVT — Guru</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h2 {
      margin-top: 0;
      color: #0f172a;
      border-bottom: 2px solid #2563eb;
      padding-bottom: 10px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      font-size: 13px;
    }
    .btn:hover { background-color: #1d4ed8; }
    .btn-secondary { background-color: #64748b; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-print { background-color: #059669; }
    .btn-print:hover { background-color: #047857; }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    table.data-table th, table.data-table td {
      border: 1px solid #cbd5e1;
      padding: 10px;
      font-size: 13px;
      text-align: left;
    }
    table.data-table th { background-color: #f8fafc; font-weight: bold; }
    table.data-table tr:hover { background-color: #f1f5f9; }

    /* LAYOUT MODAL DIMATIKAN SAAT PRINT SCRIPT DIBUKA */
    .print-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      overflow-y: auto;
    }
    .print-paper {
      max-width: 800px;
      margin: 30px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    
    /* STYLE CETAK MEDIA PRINT PERBAIKAN (MENDUKUNG MULTI-PAGE A4) */
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm 15mm 12mm 15mm;
      }
      body {
        background: #fff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      body * {
        visibility: hidden;
      }
      .print-modal, .print-modal * {
        visibility: visible;
      }
      .print-modal {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
        background: none !important;
        display: block !important;
      }
      .print-paper {
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      .no-print {
        display: none !important;
      }
      /* Mengatur Pindahnya Halaman (Page Break) */
      .page-break {
        page-break-before: always !important;
        break-before: page !important;
      }
      .avoid-break {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }

    /* KOP DOKUMEN CETAK */
    .header-title { text-align: center; font-weight: bold; margin-bottom: 12px; }
    .header-title h3 { margin: 2px 0; font-size: 15px; }
    .header-title h4 { margin: 2px 0; font-size: 13px; text-transform: uppercase; }
    .header-title p { margin: 2px 0; font-size: 10px; font-style: italic; }

    table.table-doc { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    table.table-doc th, table.table-doc td { border: 1px solid #000; padding: 4px 6px; font-size: 10.5px; vertical-align: middle; }
    table.table-doc th { background-color: #f1f5f9; text-align: center; }
    .text-center { text-align: center; }
    .section-title { font-weight: bold; font-size: 11.5px; margin-top: 12px; margin-bottom: 4px; }
    .question-block { margin-bottom: 8px; font-size: 10.5px; page-break-inside: avoid; }
    .ans-box { border: 1px solid #000; padding: 5px; font-size: 10.5px; background: #fafafa; min-height: 28px; margin-top: 2px; }
    .ttd-container { margin-top: 15px; float: right; width: 220px; text-align: center; font-size: 10.5px; page-break-inside: avoid; }
    .clear-fix { clear: both; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <h2>PORTAL PENGAWASAN & CETAK LAPORAN CVT</h2>
      <div>
        <a href="index.html" target="_blank" class="btn btn-secondary">🌐 Buka Form Siswa</a>
        <button onclick="loadData()" class="btn">🔄 Refresh Data</button>
      </div>
    </div>

    <p style="font-size:13px; color:#64748b;">Daftar siswa yang sudah menyelesaikan dan mengirimkan lembar pengamatan Overhaul CVT:</p>

    <table class="data-table">
      <thead>
        <tr>
          <th width="5%">No</th>
          <th width="15%">Waktu Kirim</th>
          <th width="12%">No. Tes</th>
          <th width="25%">Nama Siswa</th>
          <th width="15%">Kelas</th>
          <th width="18%" style="text-align:center;">Aksi</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="6" style="text-align:center;">Memuat data respon...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- MODAL PREVIEW & PRATINJAU DOKUMEN CETAK -->
  <div id="printModal" class="print-modal">
    <div class="no-print" style="max-width: 800px; margin: 15px auto 0 auto; text-align: right;">
      <button onclick="window.print()" class="btn btn-print">🖨️ Cetak Dokumen (PDF / Print)</button>
      <button onclick="closeModal()" class="btn btn-secondary">❌ Tutup</button>
    </div>

    <div id="printArea" class="print-paper">
      <!-- Isi dokumen fisik dirender dinamis di sini -->
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwMsCqOyez6EaiUT4h2sTmV2PgeClX9KomS9_ufq_Nar_iYARuiefJCdKr9qMZD53vtbA/exec";
    let responDataList = [];

    async function loadData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Memuat data terbaru...</td></tr>`;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getResponList" })
        }).then(r => r.json());

        if (res.success && res.data.length > 0) {
          responDataList = res.data;
          tbody.innerHTML = res.data.map((item, index) => {
            const tgl = new Date(item.timestamp).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
            return `
              <tr>
                <td style="text-align:center;">${index + 1}</td>
                <td>${tgl}</td>
                <td><b>${item.noTes}</b></td>
                <td>${item.nama}</td>
                <td>${item.kelas}</td>
                <td style="text-align:center;">
                  <button onclick="previewCetak(${index})" class="btn btn-print" style="padding: 5px 10px; font-size: 12px;">🖨️ Pratinjau & Cetak</button>
                </td>
              </tr>
            `;
          }).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada data pengiriman lembar pengamatan.</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Gagal mengambil data: ${err.message}</td></tr>`;
      }
    }

    function previewCetak(index) {
      const d = responDataList[index];
      const tglFormatted = new Date(d.timestamp).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      
      const kompList = ['V-Belt', 'Roller', 'Drive Pulley', 'Driven Pulley', 'Kampas Ganda', 'Cover CVT'];
      const prosList = [
        "Melepas cover CVT secara berurutan dan aman sesuai posisi baut.",
        "Melepas mur pengikat drive pulley menggunakan SST yang sesuai.",
        "Melepas komponen drive pulley, V-belt, dan driven pulley secara sistematis.",
        "Membersihkan seluruh komponen dari kotoran/debu menggunakan cairan pembersih.",
        "Memeriksa keausan, keretakan V-belt, keausan roller, serta goresan pulley.",
        "Melakukan pengukuran komponen (lebar V-belt, diameter roller/pulley).",
        "Menentukan tindakan perawatan (greasing) atau penggantian komponen aus.",
        "Merakit kembali komponen CVT sesuai urutan yang benar.",
        "Pengencangan mur pulley menggunakan kunci momen (torque wrench) sesuai spesifikasi.",
        "Pemeriksaan akhir (free play, fungsi putaran, test run) dan pelaporan."
      ];

      const html = `
        <!-- HALAMAN 1 -->
        <div class="header-title">
          <h3>SMK DIPONEGORO 1 PURWOKERTO</h3>
          <h4>LEMBAR PENGAMATAN PRAKTIK TEKNIK SEPEDA MOTOR</h4>
          <p>OVERHAUL CVT (CONTINUOUSLY VARIABLE TRANSMISSION) — VERSI CHECKLIST & JAWABAN SINGKAT</p>
        </div>

        <table class="table-doc">
          <tr>
            <td width="18%"><b>Nama Peserta:</b></td>
            <td width="32%">${d.nama}</td>
            <td width="18%"><b>No. Tes:</b></td>
            <td width="32%">${d.noTes}</td>
          </tr>
          <tr>
            <td><b>Kelas / Sem:</b></td>
            <td>${d.kelas}</td>
            <td><b>Hari / Tanggal:</b></td>
            <td>${tglFormatted}</td>
          </tr>
        </table>

        <div class="section-title">I. CHECKLIST K3, PERSIAPAN & KELENGKAPAN ALAT</div>
        <table class="table-doc">
          <thead>
            <tr><th width="6%">No</th><th>Aspek K3 & APD</th><th width="10%">Ya</th><th width="10%">Tidak</th></tr>
          </thead>
          <tbody>
            ${[
              "Menggunakan pakaian kerja (wearpack), sepatu safety, dan kacamata pelindung.",
              "Memastikan sepeda motor dalam kondisi aman dan mesin mati.",
              "Menyiapkan area kerja yang bersih, terang, serta wadah komponen.",
              "Mempersiapkan kunci sok/ring/pas, ratchet, torque wrench, dan SST.",
              "Memastikan cairan pembersih, kompresor, dan kain lap siap digunakan."
            ].map((k, i) => `
              <tr>
                <td class="text-center">${i+1}</td>
                <td>${k}</td>
                <td class="text-center">${d.k3[i] === 'Ya' ? '✔' : ''}</td>
                <td class="text-center">${d.k3[i] === 'Tidak' ? '✔' : ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="section-title">II. LEMBAR IDENTIFIKASI KOMPONEN CVT</div>
        <table class="table-doc">
          <thead>
            <tr><th width="6%">No</th><th width="25%">Nama Komponen</th><th width="35%">Fungsi Utama</th><th>Prinsip Kerja / Keterangan</th></tr>
          </thead>
          <tbody>
            ${['Drive Pulley', 'Driven Pulley', 'V-Belt', 'Roller', 'Kampas Ganda & Clutch', 'Gigi Reduksi'].map((k, i) => `
              <tr>
                <td class="text-center">${i+1}</td>
                <td><b>${k}</b></td>
                <td>${d.identifikasi[i] ? d.identifikasi[i].fungsi : '-'}</td>
                <td>${d.identifikasi[i] ? d.identifikasi[i].ket : '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="section-title">III. HASIL PEMERIKSAAN & PENGUKURAN</div>
        <table class="table-doc">
          <thead>
            <tr><th width="6%">No</th><th width="20%">Komponen</th><th width="18%">Visual</th><th width="20%">Hasil Ukur</th><th>Tindakan Perbaikan</th></tr>
          </thead>
          <tbody>
            ${kompList.map((k, i) => `
              <tr>
                <td class="text-center">${i+1}</td>
                <td><b>${k}</b></td>
                <td class="text-center">${d.pengukuran[i] ? d.pengukuran[i].visual : '-'}</td>
                <td>${d.pengukuran[i] ? d.pengukuran[i].hasilUkur : '-'}</td>
                <td>${d.pengukuran[i] ? d.pengukuran[i].tindakan : '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <!-- HALAMAN 2 (PINDAH OTOMATIS) -->
        <div class="page-break"></div>

        <div class="section-title" style="margin-top:0;">IV. CHECKLIST PROSEDUR KERJA OVERHAUL CVT</div>
        <table class="table-doc">
          <thead>
            <tr><th width="6%">No</th><th>Langkah Prosedur Kerja</th><th width="10%">Ya</th><th width="10%">Tidak</th></tr>
          </thead>
          <tbody>
            ${prosList.map((p, i) => `
              <tr>
                <td class="text-center">${i+1}</td>
                <td>${p}</td>
                <td class="text-center">${d.prosedur[i] === 'Ya' ? '✔' : ''}</td>
                <td class="text-center">${d.prosedur[i] === 'Tidak' ? '✔' : ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="section-title">V. ANALISIS HASIL PRAKTIK (JAWABAN SINGKAT)</div>
        <div class="question-block">1. Komponen aus/tidak sesuai:<div class="ans-box">${d.ans1}</div></div>
        <div class="question-block">2. Tindakan perawatan/penggantian:<div class="ans-box">${d.ans2}</div></div>
        <div class="question-block">3. Penyebab getaran/suara tidak normal:<div class="ans-box">${d.ans3}</div></div>
        <div class="question-block">4. Cara memastikan kesesuaian prosedur:<div class="ans-box">${d.ans4}</div></div>
        <div class="question-block">5. Kesimpulan overhaul CVT:<div class="ans-box">${d.ans5}</div></div>

        <div class="ttd-container avoid-break">
          Purwokerto, ${tglFormatted}<br>
          Peserta Didik,<br>
          <img src="${d.ttdBase64}" style="width:120px; height:60px; margin:4px 0;"><br>
          <b>(${d.nama})</b>
        </div>
        <div class="clear-fix"></div>
      `;

      document.getElementById('printArea').innerHTML = html;
      document.getElementById('printModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('printModal').style.display = 'none';
    }

    loadData();
  </script>
</body>
</html>
